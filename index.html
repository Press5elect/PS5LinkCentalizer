<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Links</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
  <h1>PS5 Links</h1>
  <p>PS5 scene projects. Versions updated automatically. <a href="https://github.com/pedrohti/PS5LinkCentalizer#add-a-project">Add a project</a> · <a href="offline.html">Offline projects</a></p>
  <input id="q" type="search" placeholder="Search..." aria-label="Search">
  </header>
  <table>
    <thead><tr>
      <th data-key="name"><button>Project</button></th>
      <th data-key="stars"><button title="GitHub stars">★</button></th>
      <th data-key="category" class="cat"><button>Category</button></th>
      <th data-key="description" class="col-desc"><button>Description</button></th>
      <th data-key="stable"><button title="Sort by release date">Stable</button></th>
      <th data-key="pre"><button title="Sort by release date">Beta / Pre</button></th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
  </table>
  <nav id="pager" aria-label="Pagination">
    <label>Show <select id="size"><option>15</option><option>30</option><option>50</option><option value="0">All</option></select></label>
    <span class="nav"><button id="prev" aria-label="Previous page">‹ Prev</button><span id="info"></span><button id="next" aria-label="Next page">Next ›</button></span>
  </nav>
  <footer>
    Disclaimer: this is only a link index. Not affiliated with, and not responsible for, any listed project — all belong to their respective authors and are used at your own risk.
    <a href="https://github.com/pedrohti/PS5LinkCentalizer#disclaimer">Full disclaimer</a>
  </footer>
  <button id="totop" hidden aria-label="Back to top" title="Back to top">↑</button>
</main>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const rows = document.getElementById("rows");
const q = document.getElementById("q");
const ver = v => v ? `<a href="${esc(v.url)}">${esc(v.tag)}</a><span class="date">${esc(v.date)}</span>` : "—";
// Version columns sort by release date: tags across projects aren't comparable
const sortValue = (p, key) => key === "stable" || key === "pre" ? p[key]?.date ?? "" : String(p[key] ?? "");
const cmp = new Intl.Collator("en", { numeric: true, sensitivity: "base" }).compare;
const topBar = document.querySelector(".top");
new ResizeObserver(() => document.documentElement.style.setProperty("--top", topBar.offsetHeight + "px")).observe(topBar);
const [size, prev, next, info] = ["size", "prev", "next", "info"].map(id => document.getElementById(id));
let data = [], page = 1;

const row = p => `<tr>
    <td class="name"><a href="${esc(p.url)}">${esc(p.name)}</a>${p.archived ? `<span class="tag">archived</span>` : ""}${p.category ? `<span class="tag mcat">${esc(p.category)}</span>` : ""}<span class="desc">${esc(p.description)}</span></td>
    <td class="stars">${p.stars ?? 0}</td>
    <td class="cat">${p.category ? `<span class="tag">${esc(p.category)}</span>` : ""}</td>
    <td class="desc col-desc">${esc(p.description)}</td>
    <td class="ver">${ver(p.stable)}</td>
    <td class="ver pre">${ver(p.pre)}</td>
  </tr>`;

// Search runs over the whole list, then the page is cut from the result
function render() {
  const s = q.value.toLowerCase();
  const list = data.filter(p => [p.name, p.category, p.description, p.stable?.tag, p.pre?.tag].join(" ").toLowerCase().includes(s));
  const per = +size.value || list.length || 1; // "All" = 0
  const pages = Math.max(1, Math.ceil(list.length / per));
  page = Math.min(page, pages);
  rows.innerHTML = list.slice((page - 1) * per, page * per).map(row).join("") || `<tr><td colspan="6">No results</td></tr>`;
  info.textContent = `Page ${page} of ${pages} · ${list.length} projects`;
  prev.disabled = page === 1;
  next.disabled = page === pages;
}

for (const th of document.querySelectorAll("th[data-key]")) {
  th.querySelector("button").onclick = () => {
    const key = th.dataset.key;
    // text columns start A→Z, date and star columns start highest first
    const first = ["stable", "pre", "stars"].includes(key) ? "descending" : "ascending";
    const dir = th.getAttribute("aria-sort") === first ? (first === "ascending" ? "descending" : "ascending") : first;
    document.querySelectorAll("th[aria-sort]").forEach(h => h.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort", dir);
    const sign = dir === "ascending" ? 1 : -1;
    data.sort((a, b) => {
      const x = sortValue(a, key), y = sortValue(b, key);
      if (!x !== !y) return x ? -1 : 1; // empty values always last
      return sign * cmp(x, y);
    });
    page = 1;
    render();
  };
}

q.oninput = size.onchange = () => { page = 1; render(); };
const toTop = () => scrollTo({ top: 0, behavior: "smooth" });
prev.onclick = () => { page--; render(); toTop(); };
next.onclick = () => { page++; render(); toTop(); };
// Floating button only once the list has scrolled past the first screen
const totop = document.getElementById("totop");
totop.onclick = toTop;
addEventListener("scroll", () => totop.hidden = scrollY < innerHeight / 2, { passive: true });
fetch("data.json").then(r => r.json()).then(d => { data = d; document.querySelector("th[data-key=name] button").click(); }) // default: A→Z
  .catch(() => rows.innerHTML = `<tr><td colspan="6">Failed to load data.json</td></tr>`);
</script>
</body>
</html>
