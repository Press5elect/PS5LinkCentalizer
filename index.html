<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Links</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --link:#58a6ff; --tag:#1f6feb33; }
  @media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --link:#0969da; --tag:#ddf4ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:24px; }
  p { color:var(--muted); margin:0 0 16px; }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  input { width:100%; box-sizing:border-box; padding:8px 12px; margin-bottom:16px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th button { all:unset; cursor:pointer; color:var(--muted); font-weight:600; font-size:13px; }
  th button:hover, th button:focus-visible { color:var(--fg); }
  th button::after { content:" ↕"; opacity:.4; }
  th[aria-sort=ascending] button::after { content:" ▲"; opacity:1; }
  th[aria-sort=descending] button::after { content:" ▼"; opacity:1; }
  .name a, .cat, .ver { white-space:nowrap; }
  .pre a { color:#d29922; }
  .desc { color:var(--muted); font-size:14px; }
  .tag { font-size:12px; padding:1px 8px; border-radius:99px; background:var(--tag); }
  .name .tag { margin-left:6px; }
  footer { margin-top:24px; color:var(--muted); font-size:13px; }
  .date { display:block; color:var(--muted); font-size:12px; }
  .name .desc, .name .mcat { display:none; }
  @media (max-width:700px) {
    .col-desc, .cat { display:none; }
    .name .desc { display:block; }
    .name .mcat { display:inline; }
    .ver { white-space:normal; overflow-wrap:anywhere; min-width:5.5em; }
    .name a { white-space:normal; overflow-wrap:anywhere; }
  }
</style>
</head>
<body>
<main>
  <h1>PS5 Links</h1>
  <p>PS5 scene projects. Versions updated automatically. <a href="https://github.com/pedrohti/PS5LinkCentalizer#add-a-project">Add a project</a></p>
  <input id="q" type="search" placeholder="Search..." aria-label="Search">
  <table>
    <thead><tr>
      <th data-key="name"><button>Project</button></th>
      <th data-key="category" class="cat"><button>Category</button></th>
      <th data-key="description" class="col-desc"><button>Description</button></th>
      <th data-key="stable"><button title="Sort by release date">Stable</button></th>
      <th data-key="pre"><button title="Sort by release date">Beta / Pre</button></th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
  </table>
  <footer>
    Disclaimer: this is only a link index. Not affiliated with, and not responsible for, any listed project — all belong to their respective authors and are used at your own risk.
    <a href="https://github.com/pedrohti/PS5LinkCentalizer#disclaimer">Full disclaimer</a>
  </footer>
</main>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const rows = document.getElementById("rows");
const q = document.getElementById("q");
const ver = v => v ? `<a href="${esc(v.url)}">${esc(v.tag)}</a><span class="date">${esc(v.date)}</span>` : "—";
// Version columns sort by release date: tags across projects aren't comparable
const sortValue = (p, key) => key === "stable" || key === "pre" ? p[key]?.date ?? "" : p[key] ?? "";
const cmp = new Intl.Collator("en", { numeric: true, sensitivity: "base" }).compare;
let data = [];

function render() {
  rows.innerHTML = data.map(p => `<tr>
    <td class="name"><a href="${esc(p.url)}">${esc(p.name)}</a>${p.archived ? `<span class="tag">archived</span>` : ""}${p.category ? `<span class="tag mcat">${esc(p.category)}</span>` : ""}<span class="desc">${esc(p.description)}</span></td>
    <td class="cat">${p.category ? `<span class="tag">${esc(p.category)}</span>` : ""}</td>
    <td class="desc col-desc">${esc(p.description)}</td>
    <td class="ver">${ver(p.stable)}</td>
    <td class="ver pre">${ver(p.pre)}</td>
  </tr>`).join("");
  filter();
}

function filter() {
  const s = q.value.toLowerCase();
  for (const tr of rows.rows) tr.hidden = !tr.textContent.toLowerCase().includes(s);
}

for (const th of document.querySelectorAll("th[data-key]")) {
  th.querySelector("button").onclick = () => {
    const key = th.dataset.key;
    // text columns start A→Z, date columns start newest first
    const first = key === "stable" || key === "pre" ? "descending" : "ascending";
    const dir = th.getAttribute("aria-sort") === first ? (first === "ascending" ? "descending" : "ascending") : first;
    document.querySelectorAll("th[aria-sort]").forEach(h => h.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort", dir);
    const sign = dir === "ascending" ? 1 : -1;
    data.sort((a, b) => {
      const x = sortValue(a, key), y = sortValue(b, key);
      if (!x !== !y) return x ? -1 : 1; // empty values always last
      return sign * cmp(x, y);
    });
    render();
  };
}

q.oninput = filter;
fetch("data.json").then(r => r.json()).then(d => { data = d; document.querySelector("th[data-key=name] button").click(); }) // default: A→Z
  .catch(() => rows.innerHTML = `<tr><td colspan="5">Failed to load data.json</td></tr>`);
</script>
</body>
</html>
